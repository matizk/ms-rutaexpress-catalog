spring.application.name=catalogo

server.port=${PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:RUTAEXPRESS}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.jpa.open-in-view=false

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
info.app.name=ms-rutaexpress-catalog
